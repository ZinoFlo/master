version: '3.8'
services:
  RUN-BOT:
    image: 'mysql:latest'
    container_name: 'RUN-BOT'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - /var/lib/mysql:/var/lib/mysql
